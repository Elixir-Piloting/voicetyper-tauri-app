[package]
name = "voicetyper"
version = "0.1.0"
description = "Voice dictation with AI cleanup for Linux"
authors = ["you"]
edition = "2021"

[lib]
name = "voicetyper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
hound = "3.5"
base64 = "0.22"
regex = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
dirs = "5"
once_cell = "1"
parking_lot = "0.12"
futures-util = "0.3"
tokio-stream = "0.1"

[dependencies.whisper-rs]
version = "0.16"
default-features = false

[target.'cfg(target_os = "linux")'.dependencies.whisper-rs]
version = "0.16"
default-features = false
